name: PainHunter JP Daily Run

on:
  schedule:
    # JST 03:00 = UTC 18:00 / JST 15:00 = UTC 06:00
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '取得件数（空欄=全件）'
        required: false
        default: ''

permissions:
  contents: write  # data/ と reports/ をコミットするため

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run PainHunter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python -m src.main --limit ${{ github.event.inputs.limit }} --skip-notify
          else
            python -m src.main
          fi

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          # 差分がなければコミットしない
          git diff --staged --quiet || git commit -m "daily: $(date -u +%Y-%m-%d)"
          git push